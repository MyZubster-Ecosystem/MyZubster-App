<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">MyZubster App how it works</title><desc id="desc">Documentation diagram showing observation, app client, configured gateway, documented outcomes, and separate verification boundaries for external settlement and Tor routing.</desc><rect width="1600" height="800" rx="30" fill="#07111f"/><text x="70" y="80" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="#fff">MYZUBSTER APP // HOW IT WORKS</text><text x="70" y="118" font-family="Arial,sans-serif" font-size="19" fill="#55f2ff">CLIENT FLOW · CONFIGURED CONTRACTS · EXPLICIT VERIFICATION BOUNDARIES</text><g fill="#0d2032" stroke="#42e8ff" stroke-width="3"><rect x="80" y="210" width="290" height="130" rx="18"/><rect x="455" y="210" width="290" height="130" rx="18"/><rect x="830" y="210" width="290" height="130" rx="18"/><rect x="1205" y="210" width="290" height="130" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#fff"><text x="225" y="260" font-size="23" font-weight="700">OBSERVATION</text><text x="225" y="295" font-size="17" fill="#9bdce4">user · place · evidence</text><text x="600" y="260" font-size="23" font-weight="700">APP CLIENT</text><text x="600" y="295" font-size="17" fill="#9bdce4">React Native / Expo</text><text x="975" y="260" font-size="23" font-weight="700">GATEWAY</text><text x="975" y="295" font-size="17" fill="#9bdce4">configured API contracts</text><text x="1350" y="260" font-size="23" font-weight="700">OUTCOME</text><text x="1350" y="295" font-size="17" fill="#9bdce4">documented application state</text></g><g stroke="#ff4de1" stroke-width="4" fill="#ff4de1"><path d="M370 275H455"/><path d="M745 275H830"/><path d="M1120 275H1205"/></g><rect x="130" y="440" width="640" height="200" rx="22" fill="#160c22" stroke="#ff4de1" stroke-width="3"/><rect x="830" y="440" width="640" height="200" rx="22" fill="#160c22" stroke="#ff4de1" stroke-width="3"/><g font-family="Arial,sans-serif" fill="#fff"><text x="170" y="490" font-size="23" font-weight="700" fill="#ff72e8">EXTERNAL SETTLEMENT</text><text x="170" y="530" font-size="18">App state or merge is not proof of payment.</text><text x="170" y="565" font-size="18">Gateway/provider results require independent verification.</text><text x="170" y="600" font-size="17" fill="#a9cbd2">Keep payment claims fail-closed until verified.</text><text x="870" y="490" font-size="23" font-weight="700" fill="#ff72e8">TOR / ORBOT ROUTING</text><text x="870" y="530" font-size="18">Running Orbot alone does not prove all app traffic uses Tor.</text><text x="870" y="565" font-size="18">Routing must be configured and tested explicitly.</text><text x="870" y="600" font-size="17" fill="#a9cbd2">Treat privacy transport as a verifiable boundary.</text></g><text x="800" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#55f2ff">DOCUMENTATION_VISUAL · Derived from repository documentation · Not real-world evidence</text></svg>