name: Android Beta Build

on:
  pull_request:
    paths:
      - 'App.js'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/android-beta-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Record SHA-256
        run: |
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk | tee MYZUBSTER-BETA-SHA256.txt

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: myzubster-android-beta-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            MYZUBSTER-BETA-SHA256.txt
          if-no-files-found: error
          retention-days: 30
