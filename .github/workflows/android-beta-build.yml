name: Android Lavori Standalone Build

on:
  pull_request:
    paths:
      - 'App.js'
      - 'app/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/android-beta-build.yml'
  push:
    branches:
      - beta-jobs-app
    paths:
      - 'App.js'
      - 'app/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/android-beta-build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: 'https://www.myzubster.com/api'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Package and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          cp "$APK" MyZubster-Lavori-Standalone-v1.0.2.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify MyZubster-Lavori-Standalone-v1.0.2.apk
          sha256sum MyZubster-Lavori-Standalone-v1.0.2.apk | tee MYZUBSTER-LAVORI-SHA256.txt

      - name: Upload standalone Lavori APK
        uses: actions/upload-artifact@v4
        with:
          name: myzubster-lavori-standalone-v1.0.2
          path: |
            MyZubster-Lavori-Standalone-v1.0.2.apk
            MYZUBSTER-LAVORI-SHA256.txt
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta-jobs-app'
    needs: build-apk
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: myzubster-lavori-standalone-v1.0.2
          path: release-assets

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: lavori-standalone-v1.0.2
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          MyZubster Lavori standalone Android v1.0.2 connected to the MyZubster production API.

          Fixes the Lavori screen so the complete page, including the publish form, can scroll on smaller Android displays and while the keyboard is open.

          Included flow: registration/login, publish skill exchange, apply, owner acceptance, bilateral start confirmation, bilateral completion confirmation and participant review.

          This remains a test/prerelease build. No automatic MYZ allocation, wallet settlement, payment or contract is created by the skill-exchange flow.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release-assets/MyZubster-Lavori-Standalone-v1.0.2.apk \
              release-assets/MYZUBSTER-LAVORI-SHA256.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              release-assets/MyZubster-Lavori-Standalone-v1.0.2.apk \
              release-assets/MYZUBSTER-LAVORI-SHA256.txt \
              --target "$GITHUB_SHA" \
              --title "MyZubster Lavori Standalone v1.0.2" \
              --notes-file release-notes.md \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
