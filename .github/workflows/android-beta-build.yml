name: Android Lavori Standalone Build

on:
  pull_request:
    paths:
      - 'App.js'
      - 'app/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/**'
      - '.github/workflows/android-beta-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_PUBLIC_API_URL: 'https://www.myzubster.com/api'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Package and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "Release APK not found" >&2
            exit 1
          fi
          cp "$APK" MyZubster-Lavori-Standalone-v1.0.1.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found" >&2
            exit 1
          fi
          "$APKSIGNER" verify MyZubster-Lavori-Standalone-v1.0.1.apk
          sha256sum MyZubster-Lavori-Standalone-v1.0.1.apk | tee MYZUBSTER-LAVORI-SHA256.txt

      - name: Upload standalone Lavori APK
        uses: actions/upload-artifact@v4
        with:
          name: myzubster-lavori-standalone-v1.0.1
          path: |
            MyZubster-Lavori-Standalone-v1.0.1.apk
            MYZUBSTER-LAVORI-SHA256.txt
          if-no-files-found: error
          retention-days: 30
